<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha256-fx038NkLY4U1TCrBDiu5FWPEa9eiZu01EiLryshJbCo=" crossorigin="anonymous">
  <title>精算登録フォーム</title>
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container" style="max-width: 820px;">
      <span class="navbar-brand fw-bold mb-0">精算登録フォーム</span>
      <div class="navbar-nav gap-2">
        <a class="nav-link active fw-semibold" href="/form">登録フォーム</a>
        <a class="nav-link" href="/view">精算一覧</a>
        <a class="nav-link" href="/manage">管理画面</a>
      </div>
    </div>
  </nav>

  <div class="container py-5" style="max-width: 560px;">
    <div class="card border-0 shadow-sm rounded-3">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold md-4">精算登録フォーム</h1>

        <div id="form">
          <div class="mb-3">
            <label for="content" class="form-label fw-semibold">内容</label>
            <input type="text" id="content" class="form-control" name="content" placeholder="例：買い物">
          </div>

          <div class="mb-3">
            <label for="date" class="form-label fw-semibold">日時</label>
            <input type="date" id="date" class="form-control" name="date">
          </div>

          <div class="mb-4">
            <label for="amount" class="form-label fw-semibold">金額</label>
            <div class="input-group">
              <input type="number" id="amount" class="form-control text-end" name="amount" min="0" placeholder="0">
              <span class="input-group-text">円</span>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button type="button" id="submit-btn" class="btn btn-primary btn-lg">送信する</button>
            <button type="button" id="clear-btn" class="btn btn-outline-secondary btn-sm">入力をクリア</button>
          </div>
        </div>

        <div id="result" class="alert mt-4 mb-0 d-none" role="alert"></div>
      </div>
    </div>
  </div>
  <script src="/scripts/form.js"></script>
</body>

</html>
