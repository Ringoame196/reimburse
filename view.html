<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha256-fx038NkLY4U1TCrBDiu5FWPEa9eiZu01EiLryshJbCo=" crossorigin="anonymous">
  <title>精算一覧</title>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container" style="max-width: 820px;">
      <span class="navbar-brand fw-bold mb-0">精算管理</span>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 820px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 mb-0 fw-bold">精算一覧</h1>
        </div>

        <div id="items"></div>

        <div class="d-flex justify-content-end align-items-baseline border-top pt-3 mt-3">
          <span class="text-muted me-2">合計金額：</span>
          <span id="total-amount" class="fs-4 fw-bold text-primary">0</span>
          <span class="ms-1">円</span>
        </div>
      </div>
    </div>
  </main>

  <script src="/scripts/view.js" defer></script>
</body>
</html>
